<svg width="1200" height="390" viewBox="0 0 1200 390" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08111D"/>
      <stop offset="0.52" stop-color="#0C1424"/>
      <stop offset="1" stop-color="#09121E"/>
    </linearGradient>
    <linearGradient id="core" x1="470" y1="90" x2="790" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#15223A"/>
      <stop offset="1" stop-color="#0E192B"/>
    </linearGradient>
    <linearGradient id="accent" x1="458" y1="0" x2="800" y2="0">
      <stop stop-color="#67E8F9"/>
      <stop offset=".5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#4ADE80"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" stroke="#20304A" stroke-width="1" opacity=".13"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="390" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="390" rx="26" fill="url(#grid)"/>

  <text x="48" y="48" fill="#7283A3" font-size="12" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="2.4">
    RESEARCH FOCUS
  </text>
  <text x="48" y="78" fill="#EAF0FB" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="700">
    Grounded Multimodal Reasoning for Human-Centric Vision
  </text>
  <text x="48" y="103" fill="#8292B2" font-size="13.5" font-family="Arial, Helvetica, sans-serif">
    Fuse visual evidence, body geometry, and language to support interpretable observation, comparison, explanation, and correction.
  </text>

  <!-- input column -->
  <text x="55" y="145" fill="#5D6C8B" font-size="11.5" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="1.5">
    EVIDENCE STREAMS
  </text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="50" y="165" width="255" height="57" rx="13" fill="#0F1B2E" stroke="#27425A"/>
    <circle cx="78" cy="193" r="7" fill="#67E8F9"/>
    <text x="96" y="190" fill="#D8E8F5" font-size="14" font-weight="700">Visual Perception</text>
    <text x="96" y="207" fill="#8194B3" font-size="11.5">appearance · regions · representations</text>

    <rect x="50" y="235" width="255" height="57" rx="13" fill="#0F1B2E" stroke="#493D70"/>
    <circle cx="78" cy="263" r="7" fill="#A78BFA"/>
    <text x="96" y="260" fill="#E5DEFF" font-size="14" font-weight="700">Human Geometry</text>
    <text x="96" y="277" fill="#8194B3" font-size="11.5">3D pose · joints · angles · symmetry</text>

    <rect x="50" y="305" width="255" height="57" rx="13" fill="#0F1B2E" stroke="#2E5A42"/>
    <circle cx="78" cy="333" r="7" fill="#4ADE80"/>
    <text x="96" y="330" fill="#DCFCE7" font-size="14" font-weight="700">Language Context</text>
    <text x="96" y="347" fill="#8194B3" font-size="11.5">questions · semantics · corrective feedback</text>
  </g>

  <!-- core -->
  <rect x="428" y="150" width="330" height="192" rx="24" fill="url(#core)" stroke="#6652A3" stroke-width="1.6"/>
  <rect x="449" y="169" width="288" height="4" rx="2" fill="url(#accent)" opacity=".95"/>
  <text x="593" y="210" text-anchor="middle" fill="#F2F3FF" font-size="16.5" font-family="Arial, Helvetica, sans-serif" font-weight="700">
    GROUNDED MULTIMODAL REASONING
  </text>
  <text x="593" y="232" text-anchor="middle" fill="#8292B2" font-size="11.5" font-family="Arial, Helvetica, sans-serif">
    align representations with measurable visual structure
  </text>

  <!-- neural graph inside core -->
  <g stroke="#3A4A68" stroke-width="1.2" opacity=".85">
    <path d="M490 275L545 255L600 280L660 248L706 281"/>
    <path d="M490 275L547 305L600 280L657 311L706 281"/>
    <path d="M545 255L547 305"/>
    <path d="M660 248L657 311"/>
  </g>
  <g>
    <circle cx="490" cy="275" r="7" fill="#67E8F9"/>
    <circle cx="545" cy="255" r="7" fill="#67E8F9"/>
    <circle cx="547" cy="305" r="7" fill="#A78BFA"/>
    <circle cx="600" cy="280" r="9" fill="#EAE8FF" filter="url(#glow)">
      <animate attributeName="opacity" values=".65;1;.65" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="660" cy="248" r="7" fill="#A78BFA"/>
    <circle cx="657" cy="311" r="7" fill="#4ADE80"/>
    <circle cx="706" cy="281" r="7" fill="#4ADE80"/>
  </g>

  <text x="594" y="329" text-anchor="middle" fill="#617392" font-size="10.5" font-family="monospace">
    z = fuse(vision, geometry, language)
  </text>

  <!-- outputs -->
  <text x="881" y="145" fill="#5D6C8B" font-size="11.5" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="1.5">
    REASONING CAPABILITIES
  </text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="870" y="165" width="274" height="42" rx="11" fill="#101B2C" stroke="#263A54"/>
    <text x="890" y="191" fill="#D7E5F6" font-size="13.5" font-weight="700">Observe</text>
    <text x="1002" y="191" fill="#7688A9" font-size="11.5">what is measurable?</text>

    <rect x="870" y="217" width="274" height="42" rx="11" fill="#101B2C" stroke="#3C3860"/>
    <text x="890" y="243" fill="#E2DBFF" font-size="13.5" font-weight="700">Compare</text>
    <text x="1002" y="243" fill="#7688A9" font-size="11.5">how do states differ?</text>

    <rect x="870" y="269" width="274" height="42" rx="11" fill="#101B2C" stroke="#31485A"/>
    <text x="890" y="295" fill="#D9EEFA" font-size="13.5" font-weight="700">Explain</text>
    <text x="1002" y="295" fill="#7688A9" font-size="11.5">why does it differ?</text>

    <rect x="870" y="321" width="274" height="42" rx="11" fill="#101B2C" stroke="#31533F"/>
    <text x="890" y="347" fill="#DCFCE7" font-size="13.5" font-weight="700">Correct</text>
    <text x="1002" y="347" fill="#7688A9" font-size="11.5">what should change?</text>
  </g>

  <!-- connectors -->
  <path d="M305 193C360 193 376 213 428 219" stroke="#67E8F9" stroke-width="2" stroke-dasharray="7 7" opacity=".75">
    <animate attributeName="stroke-dashoffset" values="0;-28" dur="2.2s" repeatCount="indefinite"/>
  </path>
  <path d="M305 263C357 263 382 255 428 252" stroke="#A78BFA" stroke-width="2" stroke-dasharray="7 7" opacity=".75">
    <animate attributeName="stroke-dashoffset" values="0;-28" dur="2.5s" repeatCount="indefinite"/>
  </path>
  <path d="M305 333C360 333 380 294 428 286" stroke="#4ADE80" stroke-width="2" stroke-dasharray="7 7" opacity=".75">
    <animate attributeName="stroke-dashoffset" values="0;-28" dur="2.3s" repeatCount="indefinite"/>
  </path>

  <path d="M758 246C810 246 823 208 870 190" stroke="#7DD3FC" stroke-width="1.8" stroke-dasharray="6 7" opacity=".62">
    <animate attributeName="stroke-dashoffset" values="0;-26" dur="2.6s" repeatCount="indefinite"/>
  </path>
  <path d="M758 258C810 258 823 241 870 238" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="6 7" opacity=".62">
    <animate attributeName="stroke-dashoffset" values="0;-26" dur="2.9s" repeatCount="indefinite"/>
  </path>
  <path d="M758 274C812 274 826 286 870 290" stroke="#67E8F9" stroke-width="1.8" stroke-dasharray="6 7" opacity=".62">
    <animate attributeName="stroke-dashoffset" values="0;-26" dur="2.4s" repeatCount="indefinite"/>
  </path>
  <path d="M758 290C814 290 824 330 870 342" stroke="#4ADE80" stroke-width="1.8" stroke-dasharray="6 7" opacity=".62">
    <animate attributeName="stroke-dashoffset" values="0;-26" dur="2.7s" repeatCount="indefinite"/>
  </path>

  <!-- moving evidence signals -->
  <circle r="4.5" fill="#67E8F9" filter="url(#glow)">
    <animateMotion dur="3.2s" repeatCount="indefinite" path="M305 193C360 193 376 213 428 219"/>
  </circle>
  <circle r="4.5" fill="#A78BFA" filter="url(#glow)">
    <animateMotion dur="3.6s" repeatCount="indefinite" path="M305 263C357 263 382 255 428 252"/>
  </circle>
  <circle r="4.5" fill="#4ADE80" filter="url(#glow)">
    <animateMotion dur="3s" repeatCount="indefinite" path="M305 333C360 333 380 294 428 286"/>
  </circle>
</svg>